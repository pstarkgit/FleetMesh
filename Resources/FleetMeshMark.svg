<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="FleetMesh Fleet Bridge">
  <defs>
    <linearGradient id="aurora" x1="110" y1="92" x2="914" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.47" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="228" y1="132" x2="764" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Aurora field shared with AuthBar, Stow, and Murmur. macOS supplies the
       installed app mask and shadow; the slight inset protects legacy .icns. -->
  <rect x="56" y="56" width="912" height="912" rx="218" fill="url(#aurora)"/>
  <path d="M206 128C438 32 774 88 916 288C652 224 380 320 204 496C140 376 142 248 206 128Z" fill="url(#shine)"/>
  <rect x="72" y="72" width="880" height="880" rx="202" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Fleet Bridge: two independent machine clusters joined through a small,
       explicit authority bridge. Dark knockout ink survives 16 px rendering. -->
  <g fill="none" stroke="#04110D" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 312L448 512L264 720"/>
    <path d="M752 312L576 512L760 720"/>
    <path d="M448 512H576"/>
  </g>
  <g fill="#04110D">
    <circle cx="272" cy="312" r="64"/>
    <circle cx="264" cy="720" r="64"/>
    <circle cx="448" cy="512" r="70"/>
    <circle cx="752" cy="312" r="64"/>
    <circle cx="760" cy="720" r="64"/>
    <circle cx="576" cy="512" r="70"/>
    <rect x="476" y="464" width="72" height="96" rx="22"/>
  </g>
</svg>
