<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="FleetMesh Fleet Bridge">
  <defs>
    <linearGradient id="auroraField" x1="104" y1="76" x2="920" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#075E55"/>
      <stop offset="0.46" stop-color="#063D63"/>
      <stop offset="1" stop-color="#35206F"/>
    </linearGradient>
    <linearGradient id="auroraCore" x1="190" y1="222" x2="824" y2="798" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CFFD0"/>
      <stop offset="0.45" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="shine" x1="228" y1="132" x2="764" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="emeraldBloom" cx="0" cy="0" r="1" gradientTransform="translate(270 278) rotate(39) scale(470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0" cy="0" r="1" gradientTransform="translate(748 742) rotate(-141) scale(470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="bridgeGlow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="nodeGlow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Aurora field shared with AuthBar, Stow, and Murmur. macOS supplies the
       installed app mask and shadow; the slight inset protects legacy .icns. -->
  <rect x="56" y="56" width="912" height="912" rx="218" fill="url(#auroraField)"/>
  <rect x="56" y="56" width="912" height="912" rx="218" fill="url(#emeraldBloom)"/>
  <rect x="56" y="56" width="912" height="912" rx="218" fill="url(#violetBloom)"/>
  <path d="M206 128C438 32 774 88 916 288C652 224 380 320 204 496C140 376 142 248 206 128Z" fill="url(#shine)"/>
  <rect x="72" y="72" width="880" height="880" rx="202" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"/>

  <!-- The same bridge geometry gets a broad aurora bloom, a dark separator,
       and a bright core. The core remains legible at 16 px while the bloom
       provides the luminous family treatment at Dock and Finder sizes. -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.82" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" filter="url(#bridgeGlow)">
    <path d="M272 312L448 512L264 720"/>
    <path d="M752 312L576 512L760 720"/>
    <path d="M448 512H576"/>
  </g>
  <g fill="#22D3EE" fill-opacity="0.88" filter="url(#nodeGlow)">
    <circle cx="272" cy="312" r="88"/>
    <circle cx="264" cy="720" r="88"/>
    <circle cx="448" cy="512" r="94"/>
    <circle cx="752" cy="312" r="88"/>
    <circle cx="760" cy="720" r="88"/>
    <circle cx="576" cy="512" r="94"/>
  </g>
  <g fill="none" stroke="#07151F" stroke-opacity="0.9" stroke-width="78" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 312L448 512L264 720"/>
    <path d="M752 312L576 512L760 720"/>
    <path d="M448 512H576"/>
  </g>
  <g fill="none" stroke="url(#auroraCore)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 312L448 512L264 720"/>
    <path d="M752 312L576 512L760 720"/>
    <path d="M448 512H576"/>
  </g>
  <g fill="url(#auroraCore)" stroke="#EFFFFF" stroke-opacity="0.9" stroke-width="12">
    <circle cx="272" cy="312" r="64"/>
    <circle cx="264" cy="720" r="64"/>
    <circle cx="448" cy="512" r="70"/>
    <circle cx="752" cy="312" r="64"/>
    <circle cx="760" cy="720" r="64"/>
    <circle cx="576" cy="512" r="70"/>
    <rect x="476" y="464" width="72" height="96" rx="22" stroke-width="10"/>
  </g>
  <path d="M254 291C270 277 295 277 310 290" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="12" stroke-linecap="round"/>
  <path d="M734 291C750 277 775 277 790 290" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="12" stroke-linecap="round"/>
</svg>
